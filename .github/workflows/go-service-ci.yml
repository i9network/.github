name: Go Service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      harbor_registry:
        required: false
        default: harbor.i9network.com/i9
        type: string
      docker_context:
        required: false
        default: .
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...

  build-push:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        id: tag
        run: echo "sha_tag=sha-${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.harbor_registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker_context }}
          push: true
          tags: |
            ${{ inputs.harbor_registry }}/${{ inputs.service_name }}:${{ steps.tag.outputs.sha_tag }}
            ${{ inputs.harbor_registry }}/${{ inputs.service_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    needs: [build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Checkout K8S-ISPM
        uses: actions/checkout@v4
        with:
          repository: i9network/K8S-ISPM
          token: ${{ secrets.MANIFEST_WRITE_TOKEN }}
          path: k8s-manifests
      - name: Update staging image tag
        run: |
          cd k8s-manifests
          IMAGE="${{ inputs.harbor_registry }}/${{ inputs.service_name }}:${{ needs.build-push.outputs.image_tag }}"
          yq -i "(.spec.template.spec.containers[] | select(.name == \"${{ inputs.service_name }}\")).image = \"$IMAGE\"" \
            services/staging/${{ inputs.service_name }}.yaml
      - name: Commit and push with retry-rebase
        run: |
          cd k8s-manifests
          git config user.email "ci-bot@praction.io"
          git config user.name "CI Bot"
          git add services/staging/${{ inputs.service_name }}.yaml
          git diff --staged --quiet && echo "No image change, skipping commit" && exit 0
          git commit -m "ci: bump ${{ inputs.service_name }} to ${{ needs.build-push.outputs.image_tag }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
