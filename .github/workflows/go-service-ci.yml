name: Go Service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      harbor_registry:
        required: false
        default: harbor.i9network.com/i9
        type: string
      docker_context:
        required: false
        default: .
        type: string
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: go-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...

  build-push:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: go-ci
    outputs:
      image_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        id: tag
        run: echo "sha_tag=sha-${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.harbor_registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker_context }}
          push: true
          tags: |
            ${{ inputs.harbor_registry }}/${{ inputs.service_name }}:${{ steps.tag.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    needs: [build-push]
    runs-on: go-ci
    steps:
      - name: Validate inputs
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          HARBOR_REGISTRY: ${{ inputs.harbor_registry }}
        run: |
          if ! [[ "$SERVICE_NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "ERROR: service_name must be lowercase alphanumeric with hyphens only, got: '$SERVICE_NAME'"
            exit 1
          fi
          if ! [[ "$HARBOR_REGISTRY" =~ ^[a-zA-Z0-9._:/-]+$ ]]; then
            echo "ERROR: harbor_registry contains invalid characters: '$HARBOR_REGISTRY'"
            exit 1
          fi
      - uses: mikefarah/yq@v4.44.1
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: K8S-ISPM
      - name: Checkout K8S-ISPM
        uses: actions/checkout@v4
        with:
          repository: i9network/K8S-ISPM
          token: ${{ steps.app-token.outputs.token }}
          path: k8s-manifests
      - name: Update staging image tag
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          HARBOR_REGISTRY: ${{ inputs.harbor_registry }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          cd k8s-manifests
          IMAGE="${HARBOR_REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG}"
          yq -i "(.spec.template.spec.containers[] | select(.name == \"${SERVICE_NAME}\")).image = \"${IMAGE}\"" \
            "services/staging/${SERVICE_NAME}.yaml"
      - name: Commit and push with retry-rebase
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          cd k8s-manifests
          git config user.email "286447064+neurix-ci-bot[bot]@users.noreply.github.com"
          git config user.name "Neurix CI Bot"
          git add "services/staging/${SERVICE_NAME}.yaml"
          git diff --staged --quiet && echo "No image change, skipping commit" && exit 0
          git commit -m "ci: bump ${SERVICE_NAME} to ${IMAGE_TAG}"
          PUSHED=false
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push; then
              PUSHED=true
              break
            fi
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
          $PUSHED || { echo "All push attempts failed — manifest not updated"; exit 1; }
